[package]
name = "dj-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dj-core = { path = "../dj-core" }
windows = { workspace = true, features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_System_WinRT", "Win32_Storage_Packaging_Appx"] }
windows-future = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "=3.5.0", default-features = false, features = ["native-tls", "gzip"] }
