[workspace]
resolver = "2"
members = ["crates/dj-core", "crates/dj-render", "crates/dj-win", "crates/dj-music", "crates/dj-vitals", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
skia-safe = { version = "=0.153.3", features = ["d3d", "textlayout", "binary-cache"] }
windows = "0.62"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
